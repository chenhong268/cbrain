# ci.yml — no-secret PR gate (deterministic offline suite + one network-backed step).
#
# `bun run check:ci` is deterministic with NO EXTERNAL network: src+test
# typecheck, biome, docs consistency, recall-quality matrix, and the
# deterministic test suites under tests/bin, tests/core, tests/storage,
# tests/mcp, tests/http. They mock LLM/embedding providers and need no real
# cbrain.json, vault, credentials, or external network. State isolation varies
# — most suites use mkdtempSync temp dirs; tests/http spin up in-process
# loopback servers on dynamic ports (127.0.0.1); a few tests use fixed temp
# paths or short real delays (see docs/ci-test-inventory.md).
#
# Scope of "0 exclusions": holds for the current single job, non-`--parallel`
# run. If `bun test --parallel`, concurrent same-workspace jobs, or sharding are
# ever enabled, fixed-temp-path collisions must be remediated first.
#
# The dependency-advisory gate (`bun run gate:dependencies`) is a SEPARATE
# network-backed step that calls the Bun registry to resolve security
# advisories; because it depends on an external service, the overall workflow
# is no longer purely deterministic — but it remains no-secret. It does NOT
# run the full `bun test` (LLM/Hermes/runtime gates) — those remain local /
# release gates via `bun run check` and `bun run gate:v2-preflight`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps (frozen lockfile)
        run: bun install --frozen-lockfile
      - name: Run check:ci
        run: bun run check:ci
      - name: Run dependency advisory gate
        run: bun run gate:dependencies
