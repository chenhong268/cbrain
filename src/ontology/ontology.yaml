# CBrain Ontology - 唯一真相源
# 修改此文件即可扩展类型系统，无需改代码

version: 1

# ─── 实体类型 ───────────────────────────────────────────────
entity_types:
  # 抽象父类型（abstract: true 表示不会直接创建此类型的页面）
  entity:
    label: 实体
    abstract: true
    vault_dir: brain/entities
    structured_fields: []

  entity/person:
    label: 人物
    parent: entity
    vault_dir: brain/entities/person
    structured_fields:
      - birthday
      - birthplace
      - english_name
      - current_title
      - organization
      - reports_to

  entity/company:
    label: 公司
    parent: entity
    vault_dir: brain/entities/company
    structured_fields:
      - location
      - industry
      - founded_year

  entity/organization:
    label: 组织机构
    parent: entity
    vault_dir: brain/entities/organization
    structured_fields:
      - location
      - founded_year

  entity/location:
    label: 地点
    parent: entity
    vault_dir: brain/entities/location
    structured_fields: []

  entity/place:
    label: 餐厅/场所
    parent: entity
    vault_dir: brain/entities/place
    structured_fields:
      - location
      - category

  entity/product:
    label: 产品
    parent: entity
    vault_dir: brain/entities/product
    structured_fields:
      - generic_name
      - brand_name

  entity/drug:
    label: 药品
    parent: entity
    vault_dir: brain/entities/drug
    structured_fields:
      - generic_name
      - brand_name
      - approval_status

  entity/book:
    label: 书籍
    parent: entity
    vault_dir: brain/entities/book
    structured_fields:
      - author
      - published_year
      - isbn

  entity/disease:
    label: 疾病
    parent: entity
    vault_dir: brain/entities/disease
    structured_fields:
      - icd_code
      - category

  concept:
    label: 概念
    abstract: true
    vault_dir: brain/concepts
    structured_fields: []

  concept/model:
    label: 模型/框架
    parent: concept
    vault_dir: brain/concepts/model
    structured_fields: []

  concept/pharma:
    label: 医药行业
    parent: concept
    vault_dir: brain/concepts/pharma
    structured_fields: []

  concept/psychology:
    label: 心理/认知
    parent: concept
    vault_dir: brain/concepts/psychology
    structured_fields: []

  concept/technology:
    label: 技术
    parent: concept
    vault_dir: brain/concepts/technology
    structured_fields: []

  concept/concept:
    label: 概念
    parent: concept
    vault_dir: brain/concepts/concept
    structured_fields: []

  record:
    label: 记录
    vault_dir: records
    structured_fields: []

  insight:
    label: 洞察
    vault_dir: brain/insights
    structured_fields: []

# ─── 关系类型 ───────────────────────────────────────────────
