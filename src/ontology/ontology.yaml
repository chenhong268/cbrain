    label: 认识
    domain: [entity/person]
    range: [entity/person]
    symmetric: true
    transitive: false
    strength: weak
    weight: 0.3
    aliases: [knows, 同行, 师承, 前同事, 参赛, 同行旅行, 同行参赛, 师徒, 同学/好友, 师生后决裂, 妻子, 父子, 师承与发展, 聚会, 聚餐]

