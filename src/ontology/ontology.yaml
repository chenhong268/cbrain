# ─── NER 提示词模板 ───────────────────────────────────────
ner_config:
  entity_types_prompt:
    person: "人物 — 仅指具名的人类个体，有完整姓名（如 张三、Elon Musk）。组织、产品、概念、疾病、药物等一律不是person。2-4字的中文词如果不是明确的姓名，归类为concept或对应的具体类型"
    company: "公司 — 具名的企业（如 红杉资本, 腾讯）"
    organization: "组织机构 — 非企业的组织（如 高校, 政府, 协会）"
    location: "地点 — 地理位置（如 北京, 硅谷）"
    place: "餐厅/场所 — 具名的好去处（如 某某餐厅, 某某咖啡馆）"
    product: "产品 — 具名产品（如 iPhone, 微信）"
    drug: "药品 — 具名药物（如 阿司匹林, 某某注射液）"
    book: "书籍 — 具名书籍（如《原则》, Good to Great）"
    disease: "疾病 — 具名疾病（如 前列腺癌, 糖尿病, 阿尔茨海默病）"
    model: "模型/框架 — 具名框架（OKR, SWOT）或作者构建的隐性框架（如'五大核心框架'中的每个框架点）。如果文本呈现结构化论证体系，每个论点都是独立model"
    pharma: "医药行业 — 医药政策、药品监管、集采、医保相关术语"
    psychology: "心理/认知 — 心理模式、认知规律、行为洞察（如 内在市场噪音, 情绪放大器, 自我价值依赖）"
    technology: "技术 — 具名技术（如 Transformer, Kubernetes）"
    concept: "概念 — 可复用的抽象洞察（如 复利中断成本, 噪音vs信号, 长期押注节点）。提取读者值得记住的核心观点"

  relation_prompt_order:
    - 认识
    - 任职
    - 创立
    - 归属
    - 合作
    - 竞争
    - 投资
